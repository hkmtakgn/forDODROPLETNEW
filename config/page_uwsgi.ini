[uwsgi]
plugins = python3
project = forDODROPLET
uid = root
gid = www-data
base = /var/www/%(project)
chdir = %(base)
home = /root/.virtualenvs/newprojectenv
module = project1.wsgi:application
socket = /run/uwsgi/%(project).socket
chown-socket = %(uid):%(gid)
chmod-socket = 666
master = true
vacuum = true
processes = 5
